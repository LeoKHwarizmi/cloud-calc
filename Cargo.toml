[package]
name = "cloud-calc"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres"] }
argon2 = "0.5"
meval = "0.2"
procfs = "0.16"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
rand_core = "0.6"