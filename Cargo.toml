[package]
name = "cloud-calc"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
argon2 = "0.5"
meval = "0.2"
procfs = "0.16"
tracing = "0.1"
tracing-subscriber = "0.3"
rand_core = "0.6"

# Database
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio", "macros", "tls-rustls"] }

# WebSockets + HTTP server
axum = { version = "0.7", features = ["ws"] }
hyper = "1"
futures-util = "0.3"
